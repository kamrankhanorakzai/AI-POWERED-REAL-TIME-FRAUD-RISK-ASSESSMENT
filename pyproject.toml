[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "ai-powered-real-time-fraud-risk-assessment-system"
version = "0.0.1"
description = "An AI-powered system for assessing fraud risk in real time."
authors = [
  { name = "Kamran Khan Orakzai, Khalil Ur Rehman, Obaid Ullah" },
]
license = { file = "LICENSE" }

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
requires-python = "~=3.10.0"


[tool.ruff]
line-length = 99
src = ["ai_powered_real_time_fraud_risk_assessment_system"]
include = ["pyproject.toml", "ai_powered_real_time_fraud_risk_assessment_system/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["ai_powered_real_time_fraud_risk_assessment_system"]
force-sort-within-sections = true
